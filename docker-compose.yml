services:
  portal:
    build: .
    image: ghcr.io/russrimm/microsoftcommunicationsportal:latest
    # Bind to loopback by default so the container is not exposed on all host
    # interfaces without an explicit opt-in. To expose the container to a LAN
    # or reverse proxy, change this to "3000:3000" AND set AUTH_MODE +
    # API_AUTH_TOKEN + ALLOW_REMOTE_BIND=true below.
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      # required: false means Compose silently skips this file when it's
      # absent, matching the "optional — create from .env.example" guidance
      # below. Without it, `docker compose up` fails outright if no .env
      # exists yet. Requires Docker Compose 2.20.0+.
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      # ── API authentication mode (REQUIRED when binding to non-loopback) ──
      # For the default 127.0.0.1 publish above, AUTH_MODE is auto-inferred as
      # "none-loopback-only" and no token is needed. When exposing the
      # container beyond loopback, uncomment BOTH lines below and generate a
      # strong random API_AUTH_TOKEN:
      # - AUTH_MODE=reverse-proxy
      # - API_AUTH_TOKEN=change-me-to-a-long-random-secret
      # - ALLOW_REMOTE_BIND=true
      # ── Message Center & Service Health (Entra app registration) ──
      # - AZURE_TENANT_ID=
      # - AZURE_CLIENT_ID=
      # - AZURE_CLIENT_SECRET=
      # ── Azure Service Health ──
      # - AZURE_SUBSCRIPTION_ID=
      # ── AI summaries (pick one provider) ──
      # Azure OpenAI
      # - AZURE_OPENAI_ENDPOINT=
      # - AZURE_OPENAI_API_KEY=
      # - AZURE_OPENAI_DEPLOYMENT=
      # - AZURE_OPENAI_API_VERSION=2024-10-21
      # OpenAI
      # - OPENAI_API_KEY=
      # - OPENAI_MODEL=gpt-4o-mini
      # GitHub Models
      # - GITHUB_TOKEN=
      # - GITHUB_MODEL=openai/gpt-4o-mini
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/readyz"]
      interval: 2s
      timeout: 2s
      start_period: 10s
      retries: 3
